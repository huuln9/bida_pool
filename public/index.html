<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Bida Pool</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <h1>🎱 Bida Pool</h1>
    <span id="who" class="who"></span>
  </header>

  <nav class="tabs" id="tabs">
    <button data-tab="board" class="on">Bảng xếp hạng</button>
    <button data-tab="podium">Bục vinh danh</button>
    <button data-tab="sessions">Các giải</button>
    <button data-tab="entry" class="admin-only">Nhập giải</button>
    <button data-tab="players" class="admin-only">Cơ thủ</button>
  </nav>

  <main>
    <section id="tab-board">
      <p class="sub" id="board-sub"></p>
      <div class="scroll"><table class="lb" id="lb"></table></div>
      <div class="note" id="lb-note"></div>
    </section>

    <section id="tab-podium" hidden>
      <p class="sub" id="podium-sub"></p>
      <div id="podium"></div>
    </section>

    <section id="tab-sessions" hidden>
      <div id="session-list"></div>
    </section>

    <section id="tab-entry" hidden>
      <form id="entry" autocomplete="off">
        <div class="field">
          <label for="date">Ngày thi đấu</label>
          <input type="date" id="date" required />
        </div>

        <h2>League <span class="hint">nhập số trận thắng / thua, bỏ trống nếu không chơi</span></h2>
        <div class="grid" id="league-rows"></div>
        <p class="hint" id="league-preview"></p>

        <h2>Cup <span class="hint">chọn hạng, thắng/thua tự điền (sửa được)</span></h2>
        <div class="grid" id="cup-rows"></div>

        <p class="err" id="entry-err"></p>
        <div class="actions">
          <button type="button" class="ghost" id="entry-cancel" hidden>Huỷ sửa</button>
          <button type="submit" class="primary" id="entry-submit">Lưu giải</button>
        </div>
      </form>
    </section>

    <section id="tab-players" hidden>
      <div id="player-list"></div>
      <form id="player-add" class="row-form">
        <input id="new-name" placeholder="Tên cơ thủ" maxlength="40" required />
        <textarea id="new-note" rows="1" placeholder="Ghi chú"></textarea>
        <button class="primary" type="submit">Thêm</button>
      </form>
      <p class="hint">Ghi chú: mỗi dòng là 1 ý, Enter để xuống dòng.</p>
      <p class="err" id="player-err"></p>
    </section>
  </main>

  <div class="toast" id="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
